name: LUCK LAB Windows unsigned alpha
on:
  push:
    branches: [feature/offline-casino-arcade-alpha]
  workflow_dispatch:
concurrency:
  group: luck-lab-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Real Windows Electron virtual-chips GUI smoke
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luck-lab-windows-ui-screenshots
          path: smoke-output/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Build portable and Setup
        run: npm run build:win
      - name: Verify both EXEs and checksums
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter "LUCK-LAB-Setup-*.exe")
          $portable = @(Get-ChildItem dist -Filter "LUCK-LAB-Portable-*.exe")
          if ($setup.Count -ne 1 -or $portable.Count -ne 1) { throw "Expected exactly one Setup and one Portable EXE" }
          @($setup + $portable) | ForEach-Object { Write-Output "$($_.Name) SHA256=$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash)" }
      - uses: actions/upload-artifact@v4
        with:
          name: luck-lab-windows-UNSIGNED-alpha
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
